name: Build and Test
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: python -m pytest -q
      - run: python -m neusim_ramulator.cli examples/four_core_hbm.json -o results/hbm
      - run: python -m neusim_ramulator.cli examples/dit_like_batch.json -o results/dit
      - run: python -m neusim_ramulator.stream_cli examples/pi05_tiny.json -o results/pi05-tiny
      - run: python -m neusim_ramulator.stream_cli examples/pi05_pilot.json --describe-only
