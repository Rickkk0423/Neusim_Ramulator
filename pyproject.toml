[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "neusim-ramulator"
version = "0.1.0"
description = "Online tile-level NeuSim and Ramulator2 co-simulation"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==1.26.4", "pydantic==2.10.6", "absl-py==2.1.0", "PyYAML==6.0.2"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "cmake==3.31.6"]

[project.scripts]
neusim-ramulator = "neusim_ramulator.cli:main"

[tool.setuptools.packages.find]
include = ["neusim_ramulator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the compiled official Ramulator backend"]
